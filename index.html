<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarib's Midnight Universe 🖤</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family: 'Georgia', serif;
  background: radial-gradient(circle at center, #0b1a3a, #000);
  color:white;
  overflow:hidden;
}

/* PAGE SYSTEM */
.page {
  position:absolute;
  width:100%;
  height:100vh;
  top:0;
  left:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:0.6s ease;
}

.active {
  opacity:1;
  pointer-events:auto;
}

button {
  padding:12px 20px;
  margin-top:20px;
  background:linear-gradient(45deg, navy, black);
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

h1 { font-size:28px; text-shadow:0 0 10px navy; }
p { margin-top:15px; }

/* GAME */
#gameArea {
  position:relative;
  width:90%;
  height:300px;
  border:1px solid navy;
  overflow:hidden;
  border-radius:10px;
}

#player {
  position:absolute;
  bottom:10px;
  left:45%;
  font-size:30px;
}

.heart {
  position:absolute;
  font-size:22px;
}

.kiss {
  font-size:60px;
  animation:pop 1s ease;
}

@keyframes pop {
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

<!-- PAGE 1 PASSWORD -->
<div class="page active" id="page1">
  <h1>Enter the Midnight Universe</h1>
  <input type="password" id="pass" placeholder="Password">
  <button onclick="checkPass()">Enter</button>
</div>

<!-- PAGE 2 INTRO -->
<div class="page" id="page2">
  <h1>Happy Birthday Sarib 🖤</h1>
  <p>9 March 2009 — The Night a Star Was Born</p>
  <button onclick="goTo(3)">Enter My Heart</button>
</div>

<!-- PAGE 3 LETTER -->
<div class="page" id="page3">
  <h1>For You...</h1>
  <div id="letter"></div>
  <button onclick="goTo(4)">Unlock Memories</button>
</div>

<!-- PAGE 4 MEMORY -->
<div class="page" id="page4">
  <h1>Memory Vault</h1>
  <button onclick="alert('You are my midnight blue 🖤')">Secret 1</button>
  <button onclick="alert('Distance cannot defeat us')">Secret 2</button>
  <button onclick="goTo(5)">Play My Game</button>
</div>

<!-- PAGE 5 GAME -->
<div class="page" id="page5">
  <h1>Catch My Heart</h1>
  <div id="gameArea">
    <div id="player">🖤</div>
  </div>
  <p id="score">Score: 0</p>
  <button onclick="goTo(6)">Next</button>
</div>

<!-- PAGE 6 FUTURE -->
<div class="page" id="page6">
  <h1>Our Future</h1>
  <p>One day, distance will just be a memory.</p>
  <button onclick="goTo(7)">Final Surprise</button>
</div>

<!-- PAGE 7 KISS -->
<div class="page" id="page7">
  <div class="kiss">💋</div>
  <h1>Forever Yours 🖤</h1>
</div>

<script>

/* PAGE SWITCH */
function goTo(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page'+page).classList.add('active');
}

/* PASSWORD */
function checkPass(){
  if(document.getElementById("pass").value==="09032009"){
    goTo(2);
  } else {
    alert("Wrong password 🖤");
  }
}

/* TYPEWRITER */
const text=`Sarib...

You are not just someone I love.
You are the calm in my chaos.
The midnight in my sky.
The forever I choose.`;

let i=0;
function typeWriter(){
  if(i<text.length){
    document.getElementById("letter").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,40);
  }
}
typeWriter();

/* GAME */
let score=0;
const player=document.getElementById("player");
const game=document.getElementById("gameArea");

game.addEventListener("touchmove",function(e){
  let rect=game.getBoundingClientRect();
  player.style.left=(e.touches[0].clientX-rect.left-20)+"px";
});

function dropHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*250+"px";
  heart.style.top="0px";
  game.appendChild(heart);

  let fall=setInterval(()=>{
    heart.style.top=heart.offsetTop+4+"px";

    if(heart.offsetTop>260){
      clearInterval(fall);
      heart.remove();
    }

    if(
      heart.offsetTop>230 &&
      heart.offsetLeft>player.offsetLeft-20 &&
      heart.offsetLeft<player.offsetLeft+20
    ){
      score++;
      document.getElementById("score").innerText="Score: "+score;
      heart.remove();
      clearInterval(fall);
    }

  },20);
}

setInterval(dropHeart,1500);

</script>

</body>
</html>
