<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Romantic Birthday Surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio Element -->
    <audio id="background-music" src="baarishein.mp3" loop autoplay hidden></audio>

    <!-- Rain Canvas -->
    <canvas id="rain-canvas"></canvas>

    <!-- Sections Container -->
    <div id="sections">
        <!-- Section 1: Password Portal -->
        <section id="section1" class="section active">
            <div class="center-content">
                <h1>Welcome to My World</h1>
                <p class="subtitle">This world belongs to only one person – My Jana</p>
                <input type="password" id="password-input" placeholder="Enter Our Date">
                <button id="unlock-btn" class="glow-btn">Unlock</button>
                <p id="error-msg" class="error hidden">Wrong key to my heart</p>
            </div>
        </section>

        <!-- Section 2: Mini Game -->
        <section id="section2" class="section">
            <div class="center-content">
                <h1>Catch My Heart</h1>
                <div id="game-area">
                    <div id="score">Score: 0</div>
                    <div id="game-over" class="hidden">Game Over! Try again.</div>
                    <div id="win-msg" class="hidden">Oh my God Jana, you caught my heart ❤️</div>
                </div>
                <button id="enter-gifts-btn" class="glow-btn hidden">Enter My Gifts</button>
            </div>
        </section>

        <!-- Section 3: First Gift Paragraph -->
        <section id="section3" class="section">
            <div class="center-content">
                <p id="gift-paragraph"></p>
                <button id="next-gift-btn" class="glow-btn">Open Your Next Gift</button>
            </div>
        </section>

        <!-- Section 4: Four Gift Boxes -->
        <section id="section4" class="section">
            <div class="center-content">
                <div class="gift-boxes">
                    <div class="gift-box" data-gift="1">Gift 1</div>
                    <div class="gift-box" data-gift="2">Gift 2</div>
                    <div class="gift-box" data-gift="3">Gift 3</div>
                    <div class="gift-box" data-gift="4">Gift 4</div>
                </div>
                <button id="biggest-gift-btn" class="glow-btn hidden">Touch Here For The Biggest Gift</button>
            </div>
        </section>

        <!-- Section 5: Final Surprise -->
        <section id="section5" class="section">
            <div class="center-content">
                <p id="final-text">Touch here to receive your biggest gift</p>
                <div id="surprise" class="hidden">
                    <div id="kiss-emoji">💋</div>
                    <div id="confetti"></div>
                    <p>Forever Yours</p>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
